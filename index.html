*{margin:0;padding:0;box-sizing:border-box}

canvas{display:block}

.charcard{width:110px;height:140px;background:rgba(255,255,255,.35);border-radius:16px;border:3px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:10px;transition:all .2s;backdrop-filter:blur(4px)}

.charcard .nm{color:#fff;font-weight:bold;text-shadow:0 1px 3px rgba(0,0,0,.5);font-size:14px}

#overlay button{margin-top:10px;padding:14px 60px;font-size:20px;font-weight:bold;letter-spacing:4px;color:#fff;background:linear-gradient(180deg,#ff9a56,#ff6b35);border:none;border-radius:40px;cursor:pointer;box-shadow:0 6px 0 #c74f22,0 8px 20px rgba(0,0,0,.3);transition:all .1s}
#overlay button:active{transform:translateY(4px);box-shadow:0 2px 0 #c74f22}

#joy .knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;background:rgba(255,255,255,.6);border-radius:50%}

#msgbox{position:fixed;top:110px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.5);padding:8px 18px;border-radius:20px;font-size:15px;z-index:22;display:none;pointer-events:none}

{"imports":{

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============ 基础 ============
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,200);
const sun=new THREE.DirectionalLight(0xffffff,1.4);
sun.position.set(10,20,8); sun.castShadow=true; scene.add(sun);
scene.add(new THREE.AmbientLight(0x8899aa,0.4));
const hemi=new THREE.HemisphereLight(0x87ceeb,0x4caf50,0.5);
scene.add(hemi);
// 粒子系统
const PARTICLE_COUNT=60;
const particleGeo=new THREE.BufferGeometry();
const particlePos=new Float32Array(PARTICLE_COUNT*3);
const particleSizes=new Float32Array(PARTICLE_COUNT);
for(let i=0;i<PARTICLE_COUNT;i++){particlePos[i*3]=(Math.random()-0.5)*60;particlePos[i*3+1]=Math.random()*12+1;particlePos[i*3+2]=(Math.random()-0.5)*16;particleSizes[i]=Math.random()*3+1;}
particleGeo.setAttribute('position',new THREE.BufferAttribute(particlePos,3));
particleGeo.setAttribute('size',new THREE.BufferAttribute(particleSizes,1));
const particleMat=new THREE.PointsMaterial({color:0xffffff,size:0.15,transparent:true,opacity:0.6,sizeAttenuation:true});
const particles=new THREE.Points(particleGeo,particleMat);
scene.add(particles);
const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||('ontouchstart' in window);
if(isMobile){document.getElementById('joy').style.display='block';document.getElementById('jumpBtn').style.display='flex';}
const GLOADER=new GLTFLoader();

// ============ 27B: 可爱动物角色建模 ============
function createRabbit(color) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6 });
  const white = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
  const pink = new THREE.MeshStandardMaterial({ color: 0xffb6c1, roughness: 0.5 });
  // 身体（椭圆更可爱）
  const body = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), mat);
  body.scale.set(1, 0.85, 0.9);
  // 头
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.7, 32, 32), mat);
  head.position.set(0, 1.15, 0.45);
  // 耳朵（外侧白色内侧粉色）
  const earGeo = new THREE.CapsuleGeometry(0.14, 0.75, 6, 12);
  const earL = new THREE.Mesh(earGeo, mat); earL.position.set(-0.28, 1.95, 0);
  const earR = new THREE.Mesh(earGeo, mat); earR.position.set(0.28, 1.95, 0);
  const earInnerGeo = new THREE.CapsuleGeometry(0.07, 0.45, 4, 8);
  const earInnerL = new THREE.Mesh(earInnerGeo, pink); earInnerL.position.set(-0.28, 1.95, 0.06); earInnerL.position.z += 0.01;
  const earInnerR = new THREE.Mesh(earInnerGeo, pink); earInnerR.position.set(0.28, 1.95, 0.06);
  // 眼睛（更大更萌）
  const eyeGeo = new THREE.SphereGeometry(0.1, 16, 16);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e });
  const eyeWhite = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 16), white);
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-0.22, 1.28, 0.68);
  const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set(0.22, 1.28, 0.68);
  const eyeWhiteL = eyeWhite.clone(); eyeWhiteL.position.copy(eyeL.position); eyeWhiteL.position.z += 0.02;
  const eyeWhiteR = eyeWhite.clone(); eyeWhiteR.position.copy(eyeR.position); eyeWhiteR.position.z += 0.02;
  // 腮红
  const blushGeo = new THREE.SphereGeometry(0.1, 12, 12);
  const blushMat = new THREE.MeshStandardMaterial({ color: 0xff9999, transparent: true, opacity: 0.5 });
  const blushL = new THREE.Mesh(blushGeo, blushMat); blushL.position.set(-0.38, 1.08, 0.55); blushL.scale.set(1.3, 0.6, 0.3);
  const blushR = blushL.clone(); blushR.position.x = 0.38;
  // 眉毛
  const browGeo = new THREE.BoxGeometry(0.15, 0.03, 0.03);
  const browMat = new THREE.MeshStandardMaterial({ color: 0x5a3a1a });
  const browL = new THREE.Mesh(browGeo, browMat); browL.position.set(-0.22, 1.42, 0.68); browL.rotation.z = 0.15;
  const browR = new THREE.Mesh(browGeo, browMat); browR.position.set(0.22, 1.42, 0.68); browR.rotation.z = -0.15;
  // 鼻子
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12), pink);
  nose.position.set(0, 1.08, 0.78);
  // 尾巴（毛球）
  const tail = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), white);
  tail.position.set(0, 0.15, -0.95);
  // 肚子
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.7, 32, 32), white);
  belly.position.set(0, 0.1, 0.3); belly.scale.set(1, 0.8, 0.5);
  // 脚垫
  const pawGeo = new THREE.SphereGeometry(0.18, 12, 12);
  const pawL = new THREE.Mesh(pawGeo, pink); pawL.position.set(-0.35, -0.7, 0.3); pawL.scale.set(1, 0.4, 1.2);
  const pawR = new THREE.Mesh(pawGeo, pink); pawR.position.set(0.35, -0.7, 0.3); pawR.scale.set(1, 0.4, 1.2);
  g.add(body, head, earL, earR, earInnerL, earInnerR, eyeWhiteL, eyeWhiteR, eyeL, eyeR, blushL, blushR, browL, browR, nose, tail, belly, pawL, pawR);
  // 设置动画属性
  g.userData.breathePhase = Math.random() * Math.PI * 2;
  g.userData.bouncePhase = Math.random() * Math.PI * 2;
  return g;
}
function createBear(color) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
  const darkMat = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
  const white = new THREE.MeshStandardMaterial({ color: 0xfff8e7, roughness: 0.5 });
  const pink = new THREE.MeshStandardMaterial({ color: 0xffb6c1, roughness: 0.5 });
  // 身体（圆胖）
  const body = new THREE.Mesh(new THREE.SphereGeometry(1.1, 32, 32), mat);
  body.scale.set(1, 0.9, 0.95);
  // 头（更大）
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.75, 32, 32), mat);
  head.position.set(0, 1.25, 0.5);
  // 耳朵（圆耳）
  const earGeo = new THREE.SphereGeometry(0.22, 16, 16);
  const earL = new THREE.Mesh(earGeo, mat); earL.position.set(-0.52, 1.85, 0);
  const earR = earL.clone(); earR.position.x = 0.52;
  const earInnerGeo = new THREE.SphereGeometry(0.12, 12, 12);
  const earInnerL = new THREE.Mesh(earInnerGeo, pink); earInnerL.position.set(-0.52, 1.85, 0.1); earInnerL.scale.z = 0.5;
  const earInnerR = earInnerL.clone(); earInnerR.position.x = 0.52;
  // 脸部毛色（浅色口鼻区）
  const snout = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), white);
  snout.position.set(0, 1.05, 0.82); snout.scale.set(1, 0.8, 0.6);
  // 鼻子
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 12), new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.3 }));
  nose.position.set(0, 1.12, 1.08);
  // 眼睛（黑豆眼）
  const eyeGeo = new THREE.SphereGeometry(0.09, 16, 16);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.2 });
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-0.25, 1.38, 0.78);
  const eyeR = eyeL.clone(); eyeR.position.x = 0.25;
  // 高光
  const shineGeo = new THREE.SphereGeometry(0.03, 8, 8);
  const shineMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  const shineL = new THREE.Mesh(shineGeo, shineMat); shineL.position.set(-0.22, 1.42, 0.85);
  const shineR = shineL.clone(); shineR.position.x = 0.28;
  // 肚子
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.7, 32, 32), white);
  belly.position.set(0, 0.05, 0.35); belly.scale.set(1, 0.75, 0.5);
  // 脚垫
  const pawGeo = new THREE.SphereGeometry(0.2, 12, 12);
  const pawL = new THREE.Mesh(pawGeo, pink); pawL.position.set(-0.4, -0.85, 0.3); pawL.scale.set(1, 0.35, 1.3);
  const pawR = new THREE.Mesh(pawGeo, pink); pawR.position.set(0.4, -0.85, 0.3); pawR.scale.set(1, 0.35, 1.3);
  // 尾巴（小圆球）
  const tail = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 12), mat);
  tail.position.set(0, -0.1, -1.0);
  g.add(body, head, earL, earR, earInnerL, earInnerR, snout, nose, eyeL, eyeR, shineL, shineR, belly, pawL, pawR, tail);
  g.userData.breathePhase = Math.random() * Math.PI * 2;
  g.userData.bouncePhase = Math.random() * Math.PI * 2;
  return g;
}
function createCat(color) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.5 });
  const white = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
  const pink = new THREE.MeshStandardMaterial({ color: 0xffb6c1, roughness: 0.5 });
  // 身体（修长）
  const body = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), mat);
  body.scale.set(0.9, 0.85, 1.0);
  // 头
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.72, 32, 32), mat);
  head.position.set(0, 1.2, 0.45);
  // 三角耳
  const earGeo = new THREE.ConeGeometry(0.18, 0.38, 4);
  const earL = new THREE.Mesh(earGeo, mat); earL.position.set(-0.38, 1.82, 0); earL.rotation.z = 0.15;
  const earR = new THREE.Mesh(earGeo, mat); earR.position.set(0.38, 1.82, 0); earR.rotation.z = -0.15;
  const earInnerGeo = new THREE.ConeGeometry(0.09, 0.22, 4);
  const earInnerL = new THREE.Mesh(earInnerGeo, pink); earInnerL.position.set(-0.38, 1.8, 0.05);
  const earInnerR = new THREE.Mesh(earInnerGeo, pink); earInnerR.position.set(0.38, 1.8, 0.05);
  // 脸部白毛（口鼻区）
  const snout = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), white);
  snout.position.set(0, 1.0, 0.78); snout.scale.set(1, 0.75, 0.6);
  // 眼睛（大圆眼，竖瞳）
  const eyeGeo = new THREE.SphereGeometry(0.1, 16, 16);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x4a90d9 });
  const pupilGeo = new THREE.SphereGeometry(0.06, 12, 12);
  const pupilMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e });
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-0.22, 1.3, 0.68);
  const eyeR = eyeL.clone(); eyeR.position.x = 0.22;
  const pupilL = new THREE.Mesh(pupilGeo, pupilMat); pupilL.position.set(-0.22, 1.3, 0.76);
  const pupilR = pupilL.clone(); pupilR.position.x = 0.22;
  // 高光
  const shineGeo = new THREE.SphereGeometry(0.025, 8, 8);
  const shineMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  const shineL = new THREE.Mesh(shineGeo, shineMat); shineL.position.set(-0.19, 1.34, 0.78);
  const shineR = shineL.clone(); shineR.position.x = 0.25;
  // 胡须
  const whiskerGeo = new THREE.CylinderGeometry(0.005, 0.005, 0.45, 6);
  const whiskerMat = new THREE.MeshStandardMaterial({ color: 0xdddddd });
  const whiskerL = new THREE.Mesh(whiskerGeo, whiskerMat); whiskerL.position.set(-0.38, 1.05, 0.72); whiskerL.rotation.z = Math.PI/2;
  const whiskerR = new THREE.Mesh(whiskerGeo, whiskerMat); whiskerR.position.set(0.38, 1.05, 0.72); whiskerR.rotation.z = -Math.PI/2;
  // 鼻子
  const nose = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.06, 4), pink);
  nose.position.set(0, 1.08, 0.88); nose.rotation.x = Math.PI/2;
  // 尾巴（长尾巴）
  const tailCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0, -1), new THREE.Vector3(0.1, 0.3, -1.5),
    new THREE.Vector3(-0.1, 0.7, -1.8), new THREE.Vector3(0, 1.0, -2)
  ]);
  const tailGeo = new THREE.TubeGeometry(tailCurve, 12, 0.08, 8, false);
  const tail = new THREE.Mesh(tailGeo, mat);
  // 肚子
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.65, 32, 32), white);
  belly.position.set(0, 0.05, 0.25); belly.scale.set(0.9, 0.7, 0.5);
  // 脚
  const pawGeo = new THREE.SphereGeometry(0.15, 12, 12);
  const pawL = new THREE.Mesh(pawGeo, white); pawL.position.set(-0.3, -0.75, 0.35); pawL.scale.set(1, 0.4, 1.2);
  const pawR = new THREE.Mesh(pawGeo, white); pawR.position.set(0.3, -0.75, 0.35); pawR.scale.set(1, 0.4, 1.2);
  g.add(body, head, earL, earR, earInnerL, earInnerR, snout, eyeL, eyeR, pupilL, pupilR, shineL, shineR, whiskerL, whiskerR, nose, tail, belly, pawL, pawR);
  g.userData.breathePhase = Math.random() * Math.PI * 2;
  g.userData.bouncePhase = Math.random() * Math.PI * 2;
  return g;
}
function createPig(color) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.5 });
  const pink = new THREE.MeshStandardMaterial({ color: 0xffb6c1, roughness: 0.4 });
  const darkPink = new THREE.MeshStandardMaterial({ color: 0xf48fb1, roughness: 0.5 });
  // 身体（圆胖）
  const body = new THREE.Mesh(new THREE.SphereGeometry(1.1, 32, 32), mat);
  body.scale.set(1, 0.88, 0.95);
  // 头
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.75, 32, 32), mat);
  head.position.set(0, 1.0, 0.5);
  // floppy 耳
  const earGeo = new THREE.SphereGeometry(0.22, 16, 16);
  const earL = new THREE.Mesh(earGeo, darkPink); earL.position.set(-0.52, 1.55, 0.1); earL.scale.set(0.8, 1, 0.5);
  const earR = earL.clone(); earR.position.x = 0.52;
  // 圆鼻子
  const noseGeo = new THREE.SphereGeometry(0.2, 16, 16);
  const nose = new THREE.Mesh(noseGeo, pink); nose.position.set(0, 0.88, 1.05); nose.scale.set(1.2, 0.8, 0.9);
  // 鼻孔
  const nostrilGeo = new THREE.SphereGeometry(0.04, 8, 8);
  const nostrilMat = new THREE.MeshStandardMaterial({ color: 0xc2185b });
  const nostrilL = new THREE.Mesh(nostrilGeo, nostrilMat); nostrilL.position.set(-0.07, 0.88, 1.18);
  const nostrilR = new THREE.Mesh(nostrilGeo, nostrilMat); nostrilR.position.set(0.07, 0.88, 1.18);
  // 眼睛
  const eyeGeo = new THREE.SphereGeometry(0.09, 16, 16);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e });
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-0.28, 1.15, 0.72);
  const eyeR = eyeL.clone(); eyeR.position.x = 0.28;
  const shineGeo = new THREE.SphereGeometry(0.03, 8, 8);
  const shineMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  const shineL = new THREE.Mesh(shineGeo, shineMat); shineL.position.set(-0.25, 1.19, 0.78);
  const shineR = shineL.clone(); shineR.position.x = 0.31;
  // 卷尾巴
  const tailCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0.1, -1.1), new THREE.Vector3(0.15, 0.2, -1.4),
    new THREE.Vector3(0.2, 0.4, -1.3), new THREE.Vector3(0.1, 0.5, -1.1)
  ]);
  const tailGeo = new THREE.TubeGeometry(tailCurve, 10, 0.05, 8, false);
  const tail = new THREE.Mesh(tailGeo, pink);
  // 肚子
  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.75, 32, 32), darkPink);
  belly.position.set(0, 0, 0.25); belly.scale.set(1, 0.7, 0.55);
  // 蹄子
  const hoofGeo = new THREE.CylinderGeometry(0.15, 0.18, 0.15, 12);
  const hoofMat = new THREE.MeshStandardMaterial({ color: 0x8d6e63 });
  const hoofL = new THREE.Mesh(hoofGeo, hoofMat); hoofL.position.set(-0.35, -0.95, 0.3); hoofL.scale.z = 1.2;
  const hoofR = new THREE.Mesh(hoofGeo, hoofMat); hoofR.position.set(0.35, -0.95, 0.3); hoofR.scale.z = 1.2;
  g.add(body, head, earL, earR, nose, nostrilL, nostrilR, eyeL, eyeR, shineL, shineR, tail, belly, hoofL, hoofR);
  g.userData.breathePhase = Math.random() * Math.PI * 2;
  g.userData.bouncePhase = Math.random() * Math.PI * 2;
  return g;
}

// ============ 27B: 角色配置 ============
const CHARACTERS=[
  {name:'闪电兔',create:createRabbit,color:0x8fd8ff,speed:9,jumpPower:13,doubleJump:true,attack:1,ab:'速度+二段跳'},

const NOAUDIO=location.search.indexOf('noaudio')>=0;
function ensureAudio(){if(ctx||NOAUDIO)return;try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function startBGM() {
  const bpm=[120,140,160][curLevel];
  const notes=[261.6,329.6,392,523.3,392,329.6,440,392];
  const bass=[130.8,164.8,196,261.6,196,164.8,220,196];
  let i=0;
  return setInterval(()=>{
    const f=[notes[i%8],bass[i%8]];
    [notes[i%8],bass[i%8]].forEach((freq,j)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type=j?'triangle':'square'; o.frequency.value=freq;
      g.gain.setValueAtTime(j?0.08:0.07,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+60/bpm);
      o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime+60/bpm);
    });
    i++;
  },60000/bpm);
}

// ============ 27B: 角色控制器（改造：平台碰撞+移动） ============
function updatePlayer(dt){
  if(!playerMesh)return;
  const role=CHARACTERS[selectedChar];
  let speed=role.speed;
  if(player.effects&&player.effects.boots&&player.effects.boots.active)speed*=2;
  let ix=0,iz=0;
  if(isMobile){ix=joyVec.x;iz=joyVec.y;}
  else{ if(keys['KeyW']||keys['ArrowUp'])iz-=1; if(keys['KeyS']||keys['ArrowDown'])iz+=1;
        if(keys['KeyA']||keys['ArrowLeft'])ix-=1; if(keys['KeyD']||keys['ArrowRight'])ix+=1; }
  const il=Math.hypot(ix,iz);
  if(il>0){ix/=il;iz/=il;}
  // 角色朝向
  if(il>0){const t=Math.atan2(ix,iz);playerMesh.rotation.y=t;}
  const nx=playerMesh.position.x+ix*speed*dt;
  const nz=playerMesh.position.z+iz*speed*dt;
  playerMesh.position.x=Math.max(-2,Math.min(33,nx));
  playerMesh.position.z=Math.max(-5,Math.min(5,nz));
  // 重力 + 跳跃
  player.velY-=26*dt;
  const L=LEVELS[curLevel];
  let groundY=L.groundY;
  let onAnyPlatform=false;
  // 平台碰撞（站在平台上面）
  const py=playerMesh.position.y+player.velY*dt;
  for(const p of L.platforms){
    const px=p[0],pz=p[2],pw=p[3],pd=p[4];
    if(playerMesh.position.x>px-pw/2-0.3&&playerMesh.position.x<px+pw/2+0.3&&
       playerMesh.position.z>pz-pd/2-0.3&&playerMesh.position.z<pz+pd/2+0.3){
      onAnyPlatform=true;
      if(py<=p[1]+0.3&&player.velY<=0){groundY=Math.max(groundY,p[1]+0.3);player.velY=0;}
      else if(py>p[1]-0.2&&py<p[1]+0.3&&player.velY>0){player.velY=0;playerMesh.position.y=p[1]-0.3;}
    }
  }
  playerMesh.position.y+=player.velY*dt;
  if(onAnyPlatform&&playerMesh.position.y<=groundY+0.3){playerMesh.position.y=groundY;player.velY=0;player.onGround=true;player.jumps=0;}
  else player.onGround=false;
}
function doJump(){
  if(!playerMesh)return;
  const role=CHARACTERS[selectedChar];
  if(player.onGround){player.velY=role.jumpPower;player.onGround=false;player.jumps=1;playJump();}
  else if(role.doubleJump&&player.jumps<2){player.velY=role.jumpPower*0.9;player.jumps=2;playJump();}
  else if(player.springCount>0&&!player.onGround){player.velY=role.jumpPower*1.6;player.springCount--;playJump();}
}

let joyTouch=null,joyOrigin=null,joyVec={x:0,y:0};
const joyEl=document.getElementById('joy'),knob=document.getElementById('knob');
canvas.addEventListener('touchstart',e=>{
  for(const t of e.changedTouches){
    if(!joyTouch&&t.clientX<innerWidth*0.4){joyTouch=t.identifier;joyOrigin={x:t.clientX,y:t.clientY};}
  }
},{passive:true});
canvas.addEventListener('touchmove',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===joyTouch){
      let dx=t.clientX-joyOrigin.x,dy=t.clientY-joyOrigin.y;
      const len=Math.hypot(dx,dy),max=45;
      if(len>max){dx=dx/len*max;dy=dy/len*max;}
      joyVec.x=dx/max; joyVec.y=-dy/max;
      knob.style.transform=`translate(${dx}px,${dy}px)`;
    }
  }
},{passive:true});
canvas.addEventListener('touchend',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===joyTouch){joyTouch=null;joyVec={x:0,y:0};knob.style.transform='translate(0,0)';}
  }
},{passive:true});

function collectCheck(){
  const L=LEVELS[curLevel];
  for(const c of levelObjects.coins){
    if(c.taken)continue;
    if(playerMesh.position.distanceTo(c.mesh.position)<1){
      c.taken=true; world.remove(c.mesh); coinCount++; playCoin();
      document.getElementById('coinTxt').textContent='🪙 '+coinCount;
    }
  }
  // 磁铁吸金币
  if(player.effects&&player.effects.magnet&&player.effects.magnet.active){
    for(const c of levelObjects.coins){
      if(c.taken)continue;
      if(playerMesh.position.distanceTo(c.mesh.position)<5){
        c.mesh.position.lerp(playerMesh.position,0.1);
      }
    }
  }
  // 道具
  for(const pu of levelObjects.powerups){
    if(pu.taken)continue;
    if(playerMesh.position.distanceTo(pu.mesh.position)<1){pu.taken=true;world.remove(pu.mesh);applyPowerUp(pu.type);}
  }
  // 敌人
  for(const en of levelObjects.enemies){
    if(en.dead)continue;
    const d=playerMesh.position.distanceTo(en.mesh.position);
    if(d<0.7){
      if(player.velY<-2){en.dead=true;world.remove(en.mesh);playStomp();}
      else if(player.effects&&player.effects.shield&&player.effects.shield.active){player.effects.shield.active=false;msg('🛡 泡泡盾破碎！');playStomp();}
      else if(player.effects&&player.effects.gun&&player.effects.gun.active){en.dead=true;world.remove(en.mesh);msg('💥 泡泡枪击退！');}
      else die();
    }
  }
  // 终点旗（水平距离检测）
  const fdx=playerMesh.position.x-levelObjects.flag.position.x;
  const fdz=playerMesh.position.z-levelObjects.flag.position.z;
  if(Math.hypot(fdx,fdz)<1.5)nextLevel();
}
function die(){
  if(player.invincible>0)return;
  player.lives--;
  player.invincible=1.5;
  msg('💔 撞到了！剩余 '+player.lives+' 条命');
  if(player.lives<=0){msg('游戏结束！');state='over';showOverlay('游戏结束','继续挑战下一局');}
  else{playerMesh.position.set(2,LEVELS[curLevel].groundY+1.5,0);player.velY=0;}
}
function nextLevel(){
  playWin();
  if(curLevel<LEVELS.length-1){
    curLevel++; coinCount+=10; msg('🏁 过关！+10金币');
    document.getElementById('lvlTxt').textContent='关卡 '+(curLevel+1)+' · '+LEVELS[curLevel].name;
    buildLevel();
  }else{
    msg('🎉 通关全部关卡！总分 '+coinCount);
    state='over';showOverlay('🏆 全部通关！','总金币：'+coinCount+'  🎉 你太棒了');
  }
}

// ============ 主循环 ============
let state='menu',lastTime=performance.now(),deathTimer=0;
const camTarget=new THREE.Vector3();
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now();let dt=Math.min(0.05,(now-lastTime)/1000);lastTime=now;
  levelTime+=dt;
  // 金币旋转
  for(const c of levelObjects.coins){if(!c.taken){c.mesh.rotation.y+=dt*2;c.mesh.rotation.z=Math.sin(levelTime*3+c.mesh.position.x)*0.2;c.mesh.position.y=c.baseY+Math.sin(levelTime*3+c.mesh.position.x)*0.15;}}
  // 道具旋转
  for(const pu of levelObjects.powerups){if(!pu.taken){pu.mesh.rotation.y+=dt*2;pu.mesh.rotation.x+=dt;pu.mesh.position.y=1.2+Math.sin(levelTime*2.5)*0.15;}}
  // 装饰浮动/树木摇曳
  for(const d of levelObjects.decor){
    if(d.type==='tree'){d.mesh.rotation.z=Math.sin(levelTime*1.5+d.baseY)*0.02;d.mesh.position.y=d.baseY+Math.sin(levelTime*2+d.baseY)*0.03;}
    else{d.mesh.rotation.y+=dt*0.5;d.mesh.position.y=d.baseY+Math.sin(levelTime*2+d.baseY)*0.05;}
  }
  // 粒子浮动
  const pPos=particles.geometry.attributes.position.array;
  for(let i=0;i<PARTICLE_COUNT;i++){pPos[i*3+1]+=dt*0.3;if(pPos[i*3+1]>14)pPos[i*3+1]=1;}
  particles.geometry.attributes.position.needsUpdate=true;
  // 粒子闪烁
  particleMat.opacity=0.5+Math.sin(levelTime*2)*0.2;
  // 角色呼吸动画（应用到角色模型子节点，不影响物理）
  if(playerMesh&&playerMesh.children.length>0){
    const ch=playerMesh.children[0];
    if(ch.userData.breathePhase!==undefined){
      const bp=ch.userData.breathePhase;
      const base=ch.userData.baseScale||0.4;
      const breathe=1+Math.sin(levelTime*2.5+bp)*0.03;
      ch.scale.set(base*breathe,base*(1+Math.sin(levelTime*3+bp)*0.04),base*breathe);
    }
  }
  // 敌人 AI
  for(const en of levelObjects.enemies){
    if(en.dead)continue;
    if(en.type==='mushroom'){en.mesh.position.y=en.baseY+Math.abs(Math.sin(levelTime*3))*0.5;}
    else{en.mesh.position.x=en.baseX+Math.sin(levelTime*1.5)*1.5;}
  }
  // 旗飘
  if(levelObjects.flag)levelObjects.flag.children[1].rotation.y=Math.sin(levelTime*3)*0.3;
  // 效果计时
  if(player&&player.effects){
    for(const k in player.effects){
      if(player.effects[k].active){player.effects[k].timeLeft-=dt;if(player.effects[k].timeLeft<=0)player.effects[k].active=false;}
    }
  }
  if(state==='playing'){
    updatePlayer(dt);
    collectCheck();
    if(player.invincible>0)player.invincible-=dt;
    // 摄像机跟随
    camTarget.set(playerMesh.position.x+3,playerMesh.position.y+4,playerMesh.position.z+6);
    camera.position.lerp(camTarget,0.08);
    camera.lookAt(playerMesh.position.x,playerMesh.position.y+1,playerMesh.position.z);
    // 掉出世界
    if(playerMesh.position.y<-15){player.lives--;if(player.lives<=0){msg('游戏结束');state='over';showOverlay('游戏结束','再来一局！');}else playerMesh.position.set(2,LEVELS[curLevel].groundY+1.5,0);}
  }
  renderer.render(scene,camera);
}
function showOverlay(t,s){
  clearInterval(musicStop);
  const ov=document.getElementById('overlay');
  ov.querySelector('h1').textContent=t;
  ov.querySelector('.sub').textContent=s;
  ov.querySelector('#charSel').style.display='none';
  ov.style.display='flex';
}
function startGame(){
  document.getElementById('overlay').style.display='none';
  state='playing';
  curLevel=0; coinCount=0;
  player={velY:0,onGround:true,jumps:0,lives:3,effects:{},springCount:0,gunAmmo:0};
  document.getElementById('coinTxt').textContent='🪙 0';
  document.getElementById('lvlTxt').textContent='关卡 1 · 积木森林';
  document.getElementById('charTxt').textContent=CHARACTERS[selectedChar].name;
  ensureAudio();
  if(musicStop)clearInterval(musicStop);
  if(!NOAUDIO)musicStop=startBGM();
  buildLevel();
}
document.getElementById('startBtn').addEventListener('click',()=>{
  document.getElementById('overlay').style.display='none';
  startGame();
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
// 初始演示相机（菜单背景）
camera.position.set(16,8,16); camera.lookAt(16,0,0);
buildLevel();
// 调试钩子
window.__game={start:startGame,state:()=>({state,curLevel,coinCount,lives:player?player.lives:3,char:selectedChar}),parts:()=>playerMesh&&playerMesh.children[0]?playerMesh.children[0].children.length:0,pos:()=>playerMesh?{x:+playerMesh.position.x.toFixed(1),y:+playerMesh.position.y.toFixed(1),z:+playerMesh.position.z.toFixed(1)}:null,jump:doJump,key:(c,d)=>{keys[c]=d;},teleport:(x,z)=>{playerMesh&&playerMesh.position.set(x,3,z);if(player)player.velY=-5;},pick:(i)=>{selectedChar=i;}};
animate();
</script>
